services:
  postgres:
    image: postgres:16
    container_name: ngcloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5432:5432"
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 45s
      timeout: 30s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: ngcloak-keycloak
    command: start-dev --import-realm --hostname-strict=false --proxy-headers=xforwarded
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      BACK_TO_APP_URL: https://ngcloak.onrender.com
    ports:
      - "8080:8080"
    volumes:
      - ./themes:/opt/keycloak/themes
      - ./providers:/opt/keycloak/providers
      - ./realm-export-local.json:/opt/keycloak/data/import/realm-export-local.json
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  keycloak-postgres-data:
